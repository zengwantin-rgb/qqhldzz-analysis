name: Build phone log reader
on:
  workflow_dispatch:
    inputs:
      build_host:
        description: macOS runner image
        type: choice
        required: true
        default: macos-15-intel
        options:
          - macos-26
          - macos-latest
          - macos-15
          - macos-15-intel
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ inputs.build_host }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test scanner isolation and ZIP export on GitHub
        run: |
          mkdir -p build/checks
          clang -DMJ_TEST_DEBUG -fobjc-arc -framework Foundation -lz mobile/LogReader/Scanner.m mobile/LogReader/ScannerTests.m -o build/scanner-tests
          build/scanner-tests build/checks/export-test.zip build/checks/complete-export-test.zip
          clang -fobjc-arc -framework Foundation -lz mobile/LogReader/Scanner.m mobile/LogReader/TraceControl.m mobile/LogReader/TraceControlTests.m -o build/trace-control-tests
          build/trace-control-tests
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('build/checks/export-test.zip') as z:
              assert z.testzip() is None
              assert z.read('manifest.json') == b'{}'
              assert z.read('files/日志.txt') == b'ordinary match diagnostic fixture'
          print('PASS: independent ZIP CRC and Unicode round-trip')
          import json
          with zipfile.ZipFile('build/checks/complete-export-test.zip') as z:
              assert z.testzip() is None
              manifest=json.loads(z.read('manifest.json'))
              assert len(manifest['exported_files'])==16
              assert manifest['coverage']['status']=='complete'
              assert manifest['coverage']['unselected_count']==0
              assert len(z.namelist())==17
              assert all(z.read(n)==b'ordinary match diagnostic fixture' for n in manifest['exported_files'])
          print('PASS: sixteen-file complete export, manifest coverage and independent CRC verification')
          PY
      - name: Compile and sign device IPA
        run: bash mobile/LogReader/build.sh
      - name: Build and launch simulator smoke test
        timeout-minutes: 6
        run: |
          mkdir -p build/Simulator/MJLogReader.app
          cp mobile/LogReader/Info.plist build/Simulator/MJLogReader.app/Info.plist
          sdk_path=$(xcrun --sdk iphonesimulator --show-sdk-path)
          sim_arch=$(uname -m)
          xcrun --sdk iphonesimulator clang -target "$sim_arch-apple-ios17.0-simulator" -isysroot "$sdk_path" -fobjc-arc -O1 -framework UIKit -framework Foundation -lz mobile/LogReader/main.m mobile/LogReader/Scanner.m mobile/LogReader/TraceControl.m -o build/Simulator/MJLogReader.app/MJLogReader
          device_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if "iPhone" in x["name"]))')
          xcrun simctl boot "$device_id"
          xcrun simctl bootstatus "$device_id" -b
          xcrun simctl install "$device_id" build/Simulator/MJLogReader.app
          xcrun simctl launch "$device_id" org.qqhldzz.MJLogReader --trace-panel
          sleep 3
          xcrun simctl io "$device_id" screenshot build/checks/simulator.png
      - name: Verify packaging and expected entitlements
        run: |
          python3 - <<'PY'
          import pathlib,plistlib,zipfile
          with zipfile.ZipFile('build/MJLogReader.ipa') as z:
              assert z.testzip() is None
              p=plistlib.loads(z.read('Payload/MJLogReader.app/Info.plist'))
              assert p['CFBundleIdentifier']=='org.qqhldzz.MJLogReader'
              assert p['CFBundleShortVersionString']=='1.2'
              assert p['CFBundleVersion']=='3'
              assert 'Payload/MJLogReader.app/MJLogReader' in z.namelist()
          e=plistlib.loads(pathlib.Path('build/checks/device-entitlements.plist').read_bytes())
          assert e['com.apple.private.security.no-sandbox'] is True
          assert e['com.apple.private.security.storage.AppDataContainers'] is True
          assert not any(k in e for k in ['dynamic-codesigning','com.apple.private.cs.debugger','com.apple.private.skip-library-validation'])
          print('PASS: IPA packaging and TrollStore entitlements; actual iPhone access remains untested')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phone-log-reader
          path: |
            build/MJLogReader.ipa
            build/checks/
