name: Inspect encrypted device logs
on:
  workflow_dispatch:
    inputs:
      input_version:
        type: choice
        required: true
        default: v1
        options:
          - v1
          - v2
          - v3
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download encrypted diagnostic input
        env:
          GH_TOKEN: ${{ github.token }}
          MJ_INPUT_VERSION: ${{ inputs.input_version }}
        run: |
          mkdir -p private-input
          gh release download "log-inputs-${MJ_INPUT_VERSION}" --pattern "log-input-${MJ_INPUT_VERSION}.enc" --repo zengwantin-rgb/qqhldzz-analysis --dir private-input
      - name: Decrypt input inside runner
        env:
          MJ_LOG_INPUT_KEY_V1: ${{ secrets.MJ_LOG_INPUT_KEY_V1 }}
          MJ_INPUT_VERSION: ${{ inputs.input_version }}
        run: |
          umask 077
          openssl enc -d -aes-256-cbc -pbkdf2 -in "private-input/log-input-${MJ_INPUT_VERSION}.enc" -out private-input/device.zip -pass env:MJ_LOG_INPUT_KEY_V1
      - name: Compile and inspect with allowlisted output
        run: |
          python3 -m py_compile tools/audit_export_coverage.py
          python3 -m unittest discover -s tools -p test_export_coverage.py
          python3 -m unittest discover -s tools -p test_json_gameplay.py
          python3 -m unittest discover -s tools -p test_round_multilog.py
          python3 -m unittest discover -s tools -p test_complete_configs.py
          python3 -m unittest discover -s tools -p test_ifix_patch.py
          python3 -m unittest discover -s tools -p test_xlog.py
          python3 tools/inspect_xlog.py
          python3 tools/audit_export_coverage.py
          python3 tools/inspect_phone_diagnostics.py
          python3 -m py_compile tools/inspect_device_logs.py
          python3 tools/inspect_device_logs.py
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Recover exact placeholder definition
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 42631920188 --repo zengwantin-rgb/qqhldzz-analysis --name unitymj-recovered-report --dir recovered-input
          dotnet tool install --tool-path .tools ilspycmd --version 9.1.0.7988
          .tools/ilspycmd --disable-updatecheck -t HappyMahjong.Common.MJDef -r recovered-input/recovered/assemblies recovered-input/recovered/assemblies/HappyMahjong.Hall.dll > private-input/MJDef.cs
      - name: Analyze recorded round without publishing hand values
        run: |
          python3 -m py_compile tools/analyze_round_logs.py
          python3 tools/analyze_round_logs.py
      - name: Inspect schema and managed consumers
        run: |
          dotnet build tools/ProtocolInspect/ProtocolInspect.csproj -c Release
          dotnet tools/ProtocolInspect/bin/Release/net8.0/ProtocolInspect.dll recovered-input/recovered/assemblies report/device
      - name: Index every JSON structure using recovered gameplay keys
        run: |
          python3 -m py_compile tools/index_json_gameplay.py
          python3 tools/index_json_gameplay.py
          python3 -m py_compile tools/analyze_fan_recommend.py
          python3 tools/analyze_fan_recommend.py
          python3 -m py_compile tools/analyze_finish_hands.py
          python3 tools/analyze_finish_hands.py
      - name: Recover record IO implementations
        run: |
          mkdir -p report/device/record-evidence
          .tools/ilspycmd --disable-updatecheck -t ProtocolHierarchy.ProtocolSerializer -r recovered-input/recovered/assemblies recovered-input/recovered/assemblies/HappyMahjong.Hall.dll > report/device/record-evidence/ProtocolSerializer.cs
          .tools/ilspycmd --disable-updatecheck -t HappyMahjong.PlayerRecord.PlaybackRecordService -r recovered-input/recovered/assemblies recovered-input/recovered/assemblies/HappyMahjong.Hall.dll > report/device/record-evidence/PlaybackRecordService.cs
          .tools/ilspycmd --disable-updatecheck -t HappyMahjong.Common.MemoryMonitorUtil -r recovered-input/recovered/assemblies recovered-input/recovered/assemblies/HappyMahjong.Core.dll > report/device/record-evidence/MemoryMonitorUtil.cs
          .tools/ilspycmd --disable-updatecheck -t IFix.Core.PatchManager -r recovered-input/recovered/assemblies recovered-input/recovered/assemblies/IFix.Core.dll > report/device/record-evidence/PatchManager.cs
          .tools/ilspycmd --disable-updatecheck -t GameModule.MJGameBaseConfigDetail -r recovered-input/recovered/assemblies recovered-input/recovered/assemblies/HappyMahjong.Hall.dll > report/device/record-evidence/MJGameBaseConfigDetail.cs
          .tools/ilspycmd --disable-updatecheck -t GameModule.MJGameBaseConfigUtil -r recovered-input/recovered/assemblies recovered-input/recovered/assemblies/HappyMahjong.Hall.dll > report/device/record-evidence/MJGameBaseConfigUtil.cs
          .tools/ilspycmd --disable-updatecheck -t HappyMahjong.update.CsResMgr -r recovered-input/recovered/assemblies recovered-input/recovered/assemblies/HappyMahjong.Core.dll > report/device/record-evidence/CsResMgr.cs
          .tools/ilspycmd --disable-updatecheck -t HappyMahjong.update.ConfigReader -r recovered-input/recovered/assemblies recovered-input/recovered/assemblies/HappyMahjong.Core.dll > report/device/record-evidence/ConfigReader.cs
          .tools/ilspycmd --disable-updatecheck -t HappyMahjong.IFixManager -r recovered-input/recovered/assemblies recovered-input/recovered/assemblies/HappyMahjong.Core.dll > report/device/record-evidence/IFixManager.cs
          .tools/ilspycmd --disable-updatecheck -t HappyMahjong.AppRoot -r recovered-input/recovered/assemblies recovered-input/recovered/assemblies/HappyMahjong.Hall.dll > report/device/record-evidence/AppRoot.cs
          .tools/ilspycmd --disable-updatecheck -l c recovered-input/recovered/assemblies/HappyMahjong.Core.dll > private-input/core-types.txt
          mj_combined_type=$(python3 -c 'from pathlib import Path; print(next(line.split()[-1] for line in Path("private-input/core-types.txt").read_text().splitlines() if line.split() and line.split()[-1].endswith("CombinedPatchProcessor")))')
          .tools/ilspycmd --disable-updatecheck -t "$mj_combined_type" -r recovered-input/recovered/assemblies recovered-input/recovered/assemblies/HappyMahjong.Core.dll > report/device/record-evidence/CombinedPatchProcessor.cs
          .tools/ilspycmd --disable-updatecheck -t HappyMahjong.PatchCombiner -r recovered-input/recovered/assemblies recovered-input/recovered/assemblies/HappyMahjong.Core.dll > report/device/record-evidence/PatchCombiner.cs
      - name: Probe known embedded gameplay buffers
        run: |
          python3 -m py_compile tools/probe_embedded_payloads.py
          python3 tools/probe_embedded_payloads.py
      - name: Trace candidate basenames in supplied native binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download inputs-v1 --pattern '_Decrypted.ipa' --repo zwthys-cyber/qqhldzz-analysis --dir inputs
          python3 -m py_compile tools/trace_native_file_sources.py
          python3 tools/trace_native_file_sources.py
          python3 -m py_compile tools/trace_sequence_context.py
          python3 tools/trace_sequence_context.py
          python3 -m py_compile tools/inspect_complete_configs.py
          python3 tools/inspect_complete_configs.py
          python3 -m py_compile tools/inspect_ifix_patch.py
          python3 tools/inspect_ifix_patch.py
      - uses: actions/upload-artifact@v4
        with:
          name: device-log-summary
          path: report/device/
      - name: Remove plaintext from workspace
        if: always()
        run: rm -rf private-input
