name: Probe UnityMJ format and native references
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download original inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download inputs-v1 --repo zwthys-cyber/qqhldzz-analysis --dir inputs
      - name: Install disassembly and compression readers
        run: python3 -m pip install capstone==5.0.6 lz4==4.4.5
      - name: Compile and run format probes
        run: |
          python3 -m py_compile tools/probe_unitymj.py
          python3 tools/probe_unitymj.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unitymj-format-report
          path: report/format/
