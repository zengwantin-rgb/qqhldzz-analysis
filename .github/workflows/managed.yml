name: Inspect recovered managed game logic
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  managed:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Get recovered assemblies
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 42631463972 --repo zengwantin-rgb/qqhldzz-analysis --name unitymj-recovered-report --dir recovered-input
      - name: Build metadata reader on GitHub
        run: dotnet build tools/ManagedInspect/ManagedInspect.csproj -c Release
      - name: Inspect recovered game assemblies
        run: dotnet tools/ManagedInspect/bin/Release/net8.0/ManagedInspect.dll recovered-input/recovered/assemblies report/managed
      - name: Install pinned managed decompiler
        run: dotnet tool install --tool-path .tools ilspycmd --version 9.1.0.7988
      - name: Decompile recovered game code
        run: |
          .tools/ilspycmd --disable-updatecheck -p -o report/managed/InGame -r recovered-input/recovered/assemblies recovered-input/recovered/assemblies/HappyMahjong.InGameScripts.dll
          .tools/ilspycmd --disable-updatecheck -p -o report/managed/Bootstrap -r recovered-input/recovered/assemblies recovered-input/recovered/assemblies/HappyMahjong.Bootstrap.dll
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: managed-game-report
          path: report/managed/
