name: Build native runtime metadata probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Test append-only probe output and target isolation
        run: |
          mkdir -p build
          clang -fobjc-arc -framework Foundation mobile/RuntimeProbe/ProbeStore.m mobile/RuntimeProbe/ProbeStoreTests.m -o build/probe-store-tests
          build/probe-store-tests
      - name: Compile and sign standalone device dylib
        run: bash mobile/RuntimeProbe/build.sh
      - name: Verify library and limited dependency set
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          p=pathlib.Path('build/runtime-probe')
          binary=(p/'MJRuntimeProbe.dylib').read_bytes()
          digest=hashlib.sha256(binary).hexdigest()
          assert digest==(p/'checks/SHA256SUMS.txt').read_text().split()[0]
          assert 'arm64' in (p/'checks/architecture.txt').read_text()
          for line in (p/'checks/dependencies.txt').read_text().splitlines()[1:]:
              dependency=line.strip().split(' (')[0]
              assert dependency.startswith(('@rpath/MJRuntimeProbe.dylib','/System/Library/','/usr/lib/')),dependency
          result={'version':'0.1.0','source_commit':os.environ['GITHUB_SHA'],'source_run':int(os.environ['GITHUB_RUN_ID']),
              'sha256':digest,'storage_tests_passed':True,'arm64_build_and_adhoc_signature_verified':True,
              'dependencies_limited_to_system_libraries':True,'device_injection_verified':False,
              'runtime_metadata_lookup_verified':False,'game_message_subscription_implemented':False,'live_opponent_display_implemented':False,
              'scope':'Metadata availability probe only; no code patching, method invocation, static field values, packet capture, account fields or network requests.'}
          (p/'checks/validation.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: native-runtime-probe
          path: build/runtime-probe/
