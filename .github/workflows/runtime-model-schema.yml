name: Inspect runtime model field access
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Retrieve recovered managed code
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 42631920188 --repo zengwantin-rgb/qqhldzz-analysis --name unitymj-recovered-report --dir recovered-input
      - name: Inspect source event interfaces
        run: |
          dotnet build tools/RuntimeModelInspect/RuntimeModelInspect.csproj -c Release
          dotnet tools/RuntimeModelInspect/bin/Release/net8.0/RuntimeModelInspect.dll recovered-input/recovered/assemblies report/runtime-model
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-model-schema
          path: report/runtime-model/
